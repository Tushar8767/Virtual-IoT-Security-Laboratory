version: "3.9"

# ============================================================
# Virtual IoT Security Laboratory — Docker Compose
# ============================================================
# Services:
#   mongodb   — Primary database
#   mosquitto — MQTT broker for device telemetry
#   backend   — FastAPI application (optional: build locally)
#   frontend  — React/Vite dashboard (optional: build locally)
# ============================================================

services:
  # ----------------------------------------------------------
  # MongoDB — Primary Database
  # ----------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: iot-lab-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: iot_security_lab
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - iot-lab-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------
  # Mosquitto — MQTT Broker
  # ----------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iot-lab-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"     # MQTT
      - "9001:9001"     # WebSocket MQTT
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - iot-lab-network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$sys/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # Backend — FastAPI Application
  # (Uncomment to run backend in Docker; see README for local dev)
  # ----------------------------------------------------------
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: iot-lab-backend
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   env_file:
  #     - .env
  #   environment:
  #     - MONGODB_URI=mongodb://mongodb:27017
  #     - MQTT_BROKER_HOST=mosquitto
  #   depends_on:
  #     mongodb:
  #       condition: service_healthy
  #     mosquitto:
  #       condition: service_healthy
  #   networks:
  #     - iot-lab-network
  #   volumes:
  #     - ./backend:/app

  # ----------------------------------------------------------
  # Frontend — React/Vite Dashboard
  # (Uncomment to run frontend in Docker; see README for local dev)
  # ----------------------------------------------------------
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: iot-lab-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     - VITE_API_BASE_URL=http://localhost:8000
  #     - VITE_WS_URL=ws://localhost:8000/ws
  #   depends_on:
  #     - backend
  #   networks:
  #     - iot-lab-network

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  mongodb_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_logs:
    driver: local

# ----------------------------------------------------------
# Networks
# ----------------------------------------------------------
networks:
  iot-lab-network:
    driver: bridge
