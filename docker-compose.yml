version: "3.9"

# ============================================================
# Virtual IoT Security Laboratory — Docker Compose
# ============================================================
# Services:
#   mongodb   — Primary database
#   mosquitto — MQTT broker for device telemetry
#   backend   — FastAPI application (optional: build locally)
#   frontend  — React/Vite dashboard (optional: build locally)
# ============================================================

services:
  # ----------------------------------------------------------
  # MongoDB — Primary Database
  # ----------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: iot-lab-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: iot_security_lab
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - iot-lab-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------
  # Mosquitto — MQTT Broker
  # ----------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iot-lab-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"     # MQTT
      - "9001:9001"     # WebSocket MQTT
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - iot-lab-network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$sys/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # Backend — FastAPI Application
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iot-lab-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=iot_security_lab
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - BACKEND_CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      - ALLOWED_HOSTS=*
      - SECRET_KEY=default_lab_secret_key_change_in_production_32chars
      - DEVICE_PROVISIONING_SECRET=default_provisioning_secret_change_32chars
    depends_on:
      mongodb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - iot-lab-network

  # ----------------------------------------------------------
  # Frontend — React Dashboard
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iot-lab-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
    networks:
      - iot-lab-network


# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  mongodb_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_logs:
    driver: local

# ----------------------------------------------------------
# Networks
# ----------------------------------------------------------
networks:
  iot-lab-network:
    driver: bridge

