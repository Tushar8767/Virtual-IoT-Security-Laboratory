# Mosquitto MQTT Broker Configuration
# Virtual IoT Security Laboratory

# ============================================================
# Listener Configuration
# ============================================================

# Standard MQTT on port 1883 (no TLS for local dev)
listener 1883
protocol mqtt

# WebSocket listener on port 9001 (for browser MQTT clients)
listener 9001
protocol websockets

# ============================================================
# Authentication
# ============================================================
# For Phase 0 local dev: allow anonymous connections.
# Phase 6 will add proper device credential authentication.
allow_anonymous true

# ============================================================
# Logging
# ============================================================
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ============================================================
# Persistence
# ============================================================
persistence true
persistence_location /mosquitto/data/

# ============================================================
# Message Limits
# ============================================================
max_packet_size 65536
message_size_limit 65536

# ============================================================
# Connection Limits
# ============================================================
max_connections 100
