# ============================================================
# Virtual IoT Security Laboratory — Render Blueprint
# ============================================================
# Automatically deploys the full-stack IoT Security Center:
# 1. Backend Web Service (FastAPI + Python 3.12)
# 2. Frontend Static Site (React 19 + TypeScript + Vite)
#
# To deploy:
# Connect your GitHub repository to Render and create a new Blueprint.
# ============================================================

services:
  # ----------------------------------------------------------
  # 1. Backend API & WebSocket Service
  # ----------------------------------------------------------
  - type: web
    name: iot-lab-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: MONGODB_URI
        sync: false # Enter your MongoDB Atlas URI in the Render Dashboard
      - key: MONGODB_DATABASE
        value: iot_security_lab
      - key: SECRET_KEY
        generateValue: true
      - key: DEVICE_PROVISIONING_SECRET
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: ALLOWED_HOSTS
        value: "*"

  # ----------------------------------------------------------
  # 2. Frontend Dashboard (React SPA)
  # ----------------------------------------------------------
  - type: web
    name: iot-lab-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to your deployed backend URL: https://iot-lab-backend.onrender.com
      - key: VITE_WS_URL
        sync: false # Set to your deployed backend WS URL: wss://iot-lab-backend.onrender.com/ws
